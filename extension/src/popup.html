<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>X Bookmarks Exporter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 280px;
      background-color: #0b0e11;
      color: #e6e9ec;
      padding: 14px;
      border: 1px solid #23272d;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1f242c;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #f0f3f6;
      text-transform: uppercase;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1e2632;
      color: #8b949e;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background-color: #1d9bf0;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1a8cd8;
    }

    .btn-stop {
      background-color: #d83a56;
      color: #ffffff;
    }
    .btn-stop:hover {
      background-color: #be2e47;
    }

    .btn:disabled {
      background-color: #21262d;
      color: #6e7681;
      cursor: not-allowed;
      border-color: #30363d;
    }

    .status-panel {
      margin-top: 10px;
      padding: 8px 10px;
      background-color: #12161c;
      border: 1px solid #1f252e;
      border-radius: 4px;
      font-size: 11px;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #71767b;
      flex-shrink: 0;
    }

    .status-indicator.active {
      background-color: #1d9bf0;
      box-shadow: 0 0 5px #1d9bf0;
    }

    .status-indicator.done {
      background-color: #00ba7c;
    }

    .status-indicator.error {
      background-color: #f4212e;
    }

    .status-text {
      color: #adbac7;
      word-break: break-word;
      line-height: 1.4;
    }

    .notice {
      margin-top: 8px;
      font-size: 10px;
      color: #636e7b;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">X Bookmarks</span>
    <span class="badge" id="versionBadge">v1.0</span>
  </div>

  <button class="btn btn-primary" id="actionBtn">Scrape Bookmarks</button>

  <div class="status-panel">
    <div class="status-row">
      <div class="status-indicator" id="statusDot"></div>
      <span class="status-text" id="statusText">Idle</span>
    </div>
  </div>

  <div class="notice" id="noticeText">
    Must be on x.com/i/bookmarks. Exports to JSON automatically.
  </div>

  <script src="popup.js"></script>
</body>
</html>
