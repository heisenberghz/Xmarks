<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>X Bookmarks Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 300px;
      background-color: #0b0e11;
      color: #e6e9ec;
      padding: 14px;
      border: 1px solid #23272d;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1f242c;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: #161a22;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #f0f3f6;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1e2632;
      color: #8b949e;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-dashboard {
      background-color: #f0f3f6;
      color: #0b0e11;
      border: 1px solid #ffffff;
      margin-bottom: 8px;
    }
    .btn-dashboard:hover {
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .btn-secondary {
      background-color: #161b22;
      color: #adbac7;
      border: 1px solid #30363d;
      margin-bottom: 12px;
      font-size: 11.5px;
      padding: 7px 10px;
    }
    .btn-secondary:hover {
      background-color: #21262d;
      color: #f0f3f6;
      border-color: #8b949e;
    }

    .btn-primary {
      background-color: #1d9bf0;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1a8cd8;
    }

    .btn-stop {
      background-color: #d83a56;
      color: #ffffff;
    }
    .btn-stop:hover {
      background-color: #be2e47;
    }

    .btn:disabled {
      background-color: #1b2027;
      color: #636e7b;
      cursor: not-allowed;
      border-color: #262c36;
    }

    .divider {
      height: 1px;
      background: #1f242c;
      margin: 12px 0;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #768390;
      margin-bottom: 6px;
    }

    .live-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background-color: #12171e;
      border: 1px solid #1f2836;
      border-radius: 6px;
      font-size: 11.5px;
      margin-bottom: 8px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3fb950;
      font-weight: 600;
      font-size: 11px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 6px #3fb950;
    }

    .status-panel {
      margin-top: 8px;
      padding: 8px 10px;
      background-color: #12161c;
      border: 1px solid #1f252e;
      border-radius: 4px;
      font-size: 11px;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #71767b;
      flex-shrink: 0;
    }

    .status-indicator.active {
      background-color: #1d9bf0;
      box-shadow: 0 0 5px #1d9bf0;
    }
    .status-indicator.done {
      background-color: #00ba7c;
    }
    .status-indicator.error {
      background-color: #f4212e;
    }

    .status-text {
      color: #adbac7;
      word-break: break-word;
      line-height: 1.4;
    }

    .notice {
      margin-top: 6px;
      font-size: 10px;
      color: #636e7b;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">𝕏</div>
      <span class="title">Bookmarks Manager</span>
    </div>
    <span class="badge" id="versionBadge">v1.1</span>
  </div>

  <!-- Primary Dashboard Launchers -->
  <button class="btn btn-dashboard" id="openDashboardBtn">
    <span>🚀</span> Open Full Dashboard
  </button>
  <button class="btn btn-secondary" id="openSidePanelBtn">
    <span>📑</span> Open in Side Panel
  </button>

  <!-- Live Auto-Capture Status -->
  <div class="live-status">
    <span style="color:#cdd9e5; font-size:11px;">⚡ Live Auto-Capture:</span>
    <div class="live-indicator">
      <div class="pulse-dot"></div>
      <span>ACTIVE ON X</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Bulk Scraper Section -->
  <div class="section-title">Bulk Bookmarks Sync</div>
  <button class="btn btn-primary" id="actionBtn">Scrape Bookmarks Page</button>

  <div class="status-panel">
    <div class="status-row">
      <div class="status-indicator" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready</span>
    </div>
  </div>

  <div class="notice" id="noticeText">
    Navigate to x.com/i/bookmarks to run a full sweep.
  </div>

  <script src="popup.js"></script>
</body>
</html>
